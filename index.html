<!DOCTYPE html>
<html>
  <head>
    <title>VR Laparoscopic Trainer</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        </a-assets>

      <a-entity environment="preset: contact; skyType: gradient; lighting: point"></a-entity>

      <a-box position="0 0.8 -2" width="1" height="0.5" depth="2" color="#cccccc">
        <a-text value="SURGICAL FIELD" align="center" position="0 0.3 0" rotation="-90 0 0" color="black"></a-text>
      </a-box>

      <a-entity id="ui-panel" position="0 2 -1.5">
        <a-plane color="#222" width="2" height="1" opacity="0.8"></a-plane>
        <a-text value="Laparoscopic Appendectomy\nStep 1: Calibrate Tools" align="center" position="0 0 0.1" width="3"></a-text>
      </a-entity>

      <a-entity id="rig">
        <a-camera position="0 1.6 0"></a-camera>
        
        <a-entity oculus-touch-controls="hand: left">
            <a-cylinder color="silver" height="0.3" radius="0.01" rotation="90 0 0"></a-cylinder>
        </a-entity>

        <a-entity oculus-touch-controls="hand: right">
            <a-cylinder color="silver" height="0.3" radius="0.01" rotation="90 0 0"></a-cylinder>
        </a-entity>
      </a-entity>

      <a-plane id="monitor" position="1.5 1.8 -1.8" rotation="0 -30 0" width="1.2" height="0.8" color="#000">
        <a-text value="Internal Feed" position="0 0.5 0.01" align="center" width="2"></a-text>
        </a-plane>
      
    </a-scene>
  </body>
</html>
